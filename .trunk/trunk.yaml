---
version: 0.1
cli:
  version: 1.22.2
plugins:
  sources:
    - id: trunk
      ref: v1.6.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@18.12.1
    - python@3.10.8
lint:
  definitions:
    - name: biome
      files:
        - typescript
  disabled:
    - markdownlint
    - osv-scanner
    - dotenv-linter
    - checkov
    - prettier
  enabled:
    - biome@2.6.8
    - actionlint@1.7.1
    - oxipng@9.1.1
    - svgo@3.3.2
    - git-diff-check
    - trivy@0.52.2
    - trufflehog@3.79.0
    - yamllint@1.35.1
actions:
  disabled:
    - trunk-check-pre-push
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
